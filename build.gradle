// One source tree, several Minecraft targets.
//   .\gradlew.bat build -Pmc=26.2      (default)
//   .\gradlew.bat build -Pmc=1.21.11
// Each target's Loom version, Java level and compat source folder
// are read from gradle/mc-<version>.properties.
buildscript {
	def selectedMc = project.hasProperty("mc") ? project.property("mc").toString() : "26.2"
	def selectedProps = new Properties()
	def mcPropsFile = new File(rootDir, "gradle/mc-${selectedMc}.properties")
	if (!mcPropsFile.exists()) {
		throw new GradleException("Unsupported Minecraft version: ${selectedMc} (${mcPropsFile} not found)")
	}
	mcPropsFile.withInputStream { selectedProps.load(it) }
	project.ext.mc = selectedMc
	project.ext.mcProps = selectedProps

	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${selectedProps.loom_version}"
		classpath "com.modrinth.minotaur:com.modrinth.minotaur.gradle.plugin:2.9.0"
		classpath "net.darkhax.curseforgegradle:net.darkhax.curseforgegradle.gradle.plugin:1.3.33"
	}
}

apply plugin: mcProps.loom_plugin_id
apply plugin: "maven-publish"
apply plugin: "com.modrinth.minotaur"
apply plugin: "net.darkhax.curseforgegradle"

def minecraftVersion = mcProps.minecraft_version
def javaVersion = JavaVersion.toVersion(mcProps.java_version)

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// noobs-container-searcher.jar (no version in the name: the new jar overwrites the old one in the mods folder,
// so users do not end up with stale versions piling up).
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = ""
}

// After every successful build the last number of mod_version is incremented.
// build-all.ps1 builds all targets with the same version and bumps once at the end
// by using -PnoBump.
def bumpModVersion = tasks.register("bumpModVersion") {
	description = "Increments mod_version in gradle.properties by one."
	doLast {
		def propertiesFile = file("gradle.properties")
		def text = propertiesFile.getText("UTF-8")
		def matcher = text =~ /(?m)^mod_version=(.*)$/
		if (!matcher.find()) {
			throw new GradleException("mod_version line not found in gradle.properties")
		}
		def current = matcher.group(1).trim()
		def parts = current.tokenize(".")
		if (!(parts[-1] ==~ /\d+/)) {
			throw new GradleException("mod_version must end with a number, found: ${current}")
		}
		parts[-1] = (parts[-1].toInteger() + 1).toString()
		def next = parts.join(".")
		propertiesFile.setText(text.replaceFirst(/(?m)^mod_version=.*$/, "mod_version=${next}"), "UTF-8")
		logger.lifecycle("mod_version: ${current} -> ${next}")
	}
}

if (!project.hasProperty("noBump")) {
	tasks.named("build") {
		finalizedBy bumpModVersion
	}
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"noobs_container_searcher" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Version-specific compat classes (same package and class names) are added to the client
// source set; the shared code only sees this surface.
// For older versions whose API changed a lot, the shared code itself can also be
// forked (shared_source_set); "client" is used by default.
def sharedSourceSet = mcProps.getProperty("shared_source_set", "client")
if (sharedSourceSet == "client") {
	sourceSets.client.java.srcDir "src/${mcProps.compat_source_set}/java"
} else {
	sourceSets.client.java.srcDirs = ["src/${sharedSourceSet}/java", "src/${mcProps.compat_source_set}/java"]
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	// 1.21.11 still uses the obfuscated mod namespace, 26.2 does not.
	if (mcProps.use_mojang_mappings == "true") {
		mappings loom.officialMojangMappings()
	}
	add(mcProps.mod_dependency_configuration, "net.fabricmc:fabric-loader:${mcProps.loader_version}")
	add(mcProps.mod_dependency_configuration, "net.fabricmc.fabric-api:fabric-api:${mcProps.fabric_api_version}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_dependency", mcProps.minecraft_dependency
	inputs.property "java_version", mcProps.java_version
	filesMatching("fabric.mod.json") {
		expand(
			"version": project.version,
			"minecraft_dependency": mcProps.minecraft_dependency,
			"java_version": mcProps.java_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = Integer.parseInt(mcProps.java_version)
	options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

// Publishing to Modrinth and CurseForge. The changelog is written to
// release-notes.md before every release; both platforms use the same text.
// Credentials are read from environment variables (MODRINTH_PAT, CURSEFORGE_API).
def releaseNotesFile = file("release-notes.md")
def releaseNotes = providers.provider {
	releaseNotesFile.exists() ? releaseNotesFile.getText("UTF-8") : "No changelog provided."
}

def publishJarTask = tasks.names.contains("remapJar") ? tasks.named("remapJar") : tasks.named("jar")
def publishSourcesJarTask = tasks.names.contains("remapSourcesJar") ? tasks.named("remapSourcesJar") : tasks.named("sourcesJar")

modrinth {
	token = System.getenv("MODRINTH_PAT")
	projectId = "noobs-container-searcher"
	versionNumber = "${project.mod_version}+mc${minecraftVersion}"
	versionType = "release"
	uploadFile = publishJarTask
	additionalFiles = [publishSourcesJarTask]
	gameVersions = [minecraftVersion]
	loaders = ["fabric"]
	changelog = releaseNotes
}

tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	group = "publishing"
	apiToken = System.getenv("CURSEFORGE_API")
	def mainFile = upload(1584172, publishJarTask.get())
	mainFile.changelog = releaseNotes.get()
	mainFile.changelogType = "markdown"
	mainFile.releaseType = "release"
	mainFile.addModLoader("Fabric")
	mainFile.addGameVersion(minecraftVersion)
	// Note: additional files in CurseForgeGradle (withAdditionalFile) cannot define their own game version
	// and do not inherit it from the parent file, so the sources jar is not
	// uploaded here; it is only added on the Modrinth side.
}
tasks.named("curseforge") {
	dependsOn tasks.named("build")
}
tasks.named("modrinth") {
	dependsOn tasks.named("build")
}
